<style>
  :root {
    --site-shell-width: 800px;
    --site-shell-gutter: 40px;
    --site-shell-gutter-mobile: 32px;
  }

  .global-header,
  body > main,
  body > footer,
  .note-content,
  .note-footer,
  .memory-content,
  .memory-footer {
    width: min(calc(100% - var(--site-shell-gutter)), var(--site-shell-width)) !important;
    margin-left: auto !important;
    margin-right: auto !important;
  }

  .global-header {
    position: sticky !important;
    top: 0;
    z-index: 900;
    height: 64px !important;
    margin-top: 18px !important;
    border-bottom: 1px solid var(--line);
    display: flex !important;
    align-items: center !important;
    justify-content: space-between !important;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif !important;
    font-style: normal !important;
    letter-spacing: -0.01em !important;
    transition: transform .26s cubic-bezier(.22, 1, .36, 1), background-color .18s ease, backdrop-filter .18s ease;
    will-change: transform;
  }

  .global-header.is-scrolled {
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    backdrop-filter: blur(16px) saturate(140%);
  }

  .global-header.is-hidden {
    transform: translateY(calc(-100% - 20px));
  }

  .global-header .global-brand {
    color: var(--text);
    font-family: inherit !important;
    font-size: 12px !important;
    font-style: normal !important;
    font-weight: 560 !important;
    line-height: 1 !important;
    letter-spacing: .04em !important;
  }

  .global-header .global-nav {
    display: flex !important;
    align-items: center !important;
    gap: 22px !important;
  }

  .global-header .global-nav a,
  .global-header .global-nav a[aria-current="page"] {
    color: var(--muted);
    font-family: inherit !important;
    font-size: 11px !important;
    font-style: normal !important;
    font-weight: 400 !important;
    line-height: 1 !important;
    letter-spacing: -0.01em !important;
  }

  .global-header .global-nav a:hover,
  .global-header .global-nav a[aria-current="page"] {
    color: var(--text);
  }

  .note-hero h1,
  .article-body,
  .article-share,
  .related-notes {
    max-width: 100% !important;
  }

  @supports not (background: color-mix(in srgb, white, black)) {
    .global-header.is-scrolled {
      background: var(--bg);
    }
  }

  @media (max-width: 560px) {
    .global-header,
    body > main,
    body > footer,
    .note-content,
    .note-footer,
    .memory-content,
    .memory-footer {
      width: calc(100% - var(--site-shell-gutter-mobile)) !important;
    }

    .global-header .global-nav {
      gap: 14px !important;
    }

    .global-header .global-nav a,
    .global-header .global-nav a[aria-current="page"] {
      font-size: 10.5px !important;
      font-weight: 400 !important;
    }

    .global-header .theme-toggle {
      position: static !important;
      z-index: auto !important;
      width: 26px !important;
      height: 26px !important;
      margin: 0 -5px 0 -1px !important;
      flex: 0 0 26px;
      opacity: .82;
    }

    .global-header .theme-toggle:hover {
      background: transparent;
    }

    .global-header .theme-toggle-icon {
      width: 15px;
      height: 15px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .global-header {
      transition: none !important;
    }
  }
</style>
<header class="global-header">
  <a class="global-brand" href="{{ '/' | relative_url }}">4k29</a>
  <nav class="global-nav" aria-label="メインナビゲーション">
    <a href="{{ '/notes/' | relative_url }}"{% if page.url == '/notes/' or page.collection == 'notes' %} aria-current="page"{% endif %}>Notes</a>
    <a href="{{ '/memory/' | relative_url }}"{% if page.url == '/memory/' or page.collection == 'memories' %} aria-current="page"{% endif %}>Memory</a>
  </nav>
</header>
