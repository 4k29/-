title: 4k29
description: ガジェットやサービスの設計・デザイン・使い心地を考察する4k29。AppleやNothingについての記事と、旅先で撮影した写真を公開しています。
author: うまいしか
image: /images/ogp/4k29.png
twitter_username: "@p_horeer"
# Fill only with the verification values issued by the respective service.
google_site_verification: ""
bing_site_verification: ""
url: https://4k29.github.io
baseurl: /4k29
lang: ja
timezone: Asia/Tokyo
encoding: utf-8

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

collections:
  memories:
    output: true
    permalink: /memory/:name.html
    sort_by: date
  notes:
    output: true
    permalink: /notes/:name.html
    sort_by: date
    future: true

defaults:
  - scope:
      path: ""
      type: memories
    values:
      layout: memory
  - scope:
      path: ""
      type: notes
    values:
      layout: note
      author: うまいしか

exclude:
  - node_modules
  - package.json
  - package-lock.json
  - vendor
